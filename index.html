<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 빵 추첨기 🥐</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
  <!-- 다크모드 / 화이트모드 토글 버튼 -->
  <aside class="theme-switch-container">
    <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="테마 전환" title="다크모드 / 화이트모드 전환">
      <span class="theme-icon" id="themeIcon">🌙</span>
      <span class="theme-label" id="themeLabel">다크모드</span>
    </button>
  </aside>

  <!-- 메인 앱 카드 -->
  <main class="app">
    <div class="header-tags">
      <span class="label">JONGHWAN'S BAKERY PICKER</span>
    </div>
    <h1>오늘은 무슨 빵 먹지? 🥐</h1>
    <p class="subtitle">고민은 그만! 버튼을 눌러 오늘의 빵을 뽑아보세요.</p>

    <!-- 추첨 결과 -->
    <section class="result" aria-live="polite" aria-atomic="true">
      <div class="bread" id="breadEmoji">🍞</div>
      <div class="bread-name" id="breadName">오늘의 빵을 기다리는 중!</div>
      <div class="bread-desc" id="breadDesc">아래 버튼을 눌러 빵을 추첨해 보세요.</div>
    </section>

    <!-- 추첨 액션 버튼 -->
    <button id="pickButton" class="btn-pick" type="button">🎲 빵 랜덤 추첨하기!</button>
    <p class="hint">총 15가지 맛있는 빵 중 하나를 무작위로 추천해 드려요.</p>

    <!-- 최근 추첨 기록 -->
    <section class="history">
      <div class="history-header">
        <h2>최근 뽑은 빵</h2>
        <button id="clearHistoryBtn" type="button" class="btn-clear" title="추첨 기록 비우기">기록 비우기</button>
      </div>
      <div id="historyList">
        <span class="chip chip-empty">아직 추첨 기록이 없어요.</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
