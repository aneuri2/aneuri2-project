      { id: 59, name: "타르데마베이커리 우장산점", region: "서울", loc: "서울 강서구 우장산", lat: 37.5480, lng: 126.8360, menus: ["마약옥수수식빵", "고르곤졸라식빵"], review: "방송 다수 출연! 토핑이 폭발하는 식빵의 성지." },
      { id: 60, name: "바누아투", region: "청주/충청", loc: "청주시 흥덕구 복대동", lat: 36.6370, lng: 127.4360, menus: ["세계제과제빵대회 우승빵"], review: "세계대회 1위에 빛나는 청주 최고 권위의 제과점." },
      { id: 61, name: "안셈", region: "청주/충청", loc: "청주시 흥덕구 복대동", lat: 36.6360, lng: 127.4380, menus: ["팥선생", "앙버터"], review: "팥에 진심인 빵집. 적당히 달고 고소한 팥앙금이 대박." }
    ];

    // 지도 초기화 (대한민국 전체 시점)
    const map = L.map('map', {
      zoomControl: false
    }).setView([35.8, 127.8], 7);

    // 줌 컨트롤 위치 조정
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Leaflet 타일 레이어 (CartoDB Positron - 감성적이고 깔끔한 지도)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    let markers = [];
    let currentData = [...rawData];

    // 마커 생성 및 이벤트 바인딩
    function renderMap(data) {
      // 기존 마커 제거
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      data.forEach((item, index) => {
        // 이미지 랜덤 매핑
        const bgImg = breadImages[index % breadImages.length];

        const customIcon = L.divIcon({
          className: 'custom-marker-wrap',
          html: `<div class="custom-marker"><i class="fa-solid fa-bread-slice"></i></div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);

        const popupContent = `
          <div class="popup-card">
            <div class="popup-img-wrap">
              <img src="${bgImg}" onerror="this.src='${fallbackSvg}'" alt="${item.name}">
              <span class="popup-badge">${item.region}</span>
            </div>
            <div class="popup-body">
              <h3 class="popup-title">${item.name}</h3>
              <div class="popup-loc"><i class="fa-solid fa-location-dot"></i> ${item.loc}</div>
              <div class="popup-menus">
                ${item.menus.map(m => `<span class="menu-chip">${m}</span>`).join('')}
              </div>
              <div class="popup-review">
                <i class="fa-solid fa-quote-left"></i> ${item.review}
              </div>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent, { offset: [0, -10] });

        marker.on('click', () => {
          map.flyTo([item.lat, item.lng], 14, { duration: 1.2 });
          highlightCard(item.id);
        });

        markers.push(marker);
      });
    }

    // 사이드바 리스트 생성
    function renderList(data) {
      const listEl = document.getElementById('bakery-list');
      const countEl = document.getElementById('count-text');
      countEl.innerText = `(${data.length})`;
      listEl.innerHTML = '';

      if (data.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:40px 0; color:#a09383; font-size:14px;">검색 결과가 없습니다 🥐</div>`;
        return;
      }

      data.forEach((item, index) => {
        const bgImg = breadImages[index % breadImages.length];
        const card = document.createElement('div');
        card.className = 'bakery-card';
        card.id = `card-${item.id}`;
        card.innerHTML = `
          <img class="bakery-img" src="${bgImg}" onerror="this.src='${fallbackSvg}'" alt="${item.name}">
          <div class="bakery-info">
            <div class="bakery-name">${item.name}</div>
            <div class="bakery-loc"><i class="fa-solid fa-location-dot" style="color:#e86a33"></i> ${item.loc}</div>
            <div class="bakery-menus">
              ${item.menus.slice(0, 2).map(m => `<span class="menu-chip">${m}</span>`).join('')}
            </div>
          </div>
        `;

        card.addEventListener('click', () => {
          map.flyTo([item.lat, item.lng], 15, { duration: 1 });
          const markerIndex = rawData.findIndex(d => d.id === item.id);
          if (markers[markerIndex]) {
            markers[markerIndex].openPopup();
          }
          highlightCard(item.id);
        });

        listEl.appendChild(card);
      });
    }

    function highlightCard(id) {
      document.querySelectorAll('.bakery-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // 검색 및 필터링 기능
    function filterData() {
      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
      const activeTag = document.querySelector('.tag-btn.active').dataset.region;

      currentData = rawData.filter(item => {
        const matchRegion = (activeTag === '전체') || 
                            (activeTag === '해외/기타' ? (item.region === '해외/기타' || item.region === '기타' || item.region === '인천/경기' || item.region === '제주') : item.region === activeTag);
        
        const matchSearch = item.name.toLowerCase().includes(searchVal) ||
                            item.loc.toLowerCase().includes(searchVal) ||
                            item.menus.some(m => m.toLowerCase().includes(searchVal));

        return matchRegion && matchSearch;
      });

      renderMap(currentData);
      renderList(currentData);
    }

    // 이벤트 리스너 설정
    document.getElementById('search-input').addEventListener('input', filterData);

    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        // 필터 전환 시 지도 카메라 이동
        const reg = e.target.dataset.region;
        if(reg === '서울') map.flyTo([37.55, 126.98], 11);
        else if(reg === '대전') map.flyTo([36.33, 127.38], 12);
        else if(reg === '청주/충청') map.flyTo([36.65, 127.46], 11);
        else if(reg === '전체') map.flyTo([35.8, 127.8], 7);
        
        filterData();
      });
    });

    // 앱 초기화
    renderMap(rawData);
    renderList(rawData);
  </script>
</body>
</html>
